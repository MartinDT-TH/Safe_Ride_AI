name: Build and Publish for MonsterASP

on:
  push:
    branches:
      - main_demo_project # CHANGE ME: nhánh source cần theo dõi

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monsterasp-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.203" # CHANGE ME nếu project không dùng .NET 8

  API_PROJECT: "./src/SRD_Master/SafeRide.API/SafeRide.API.csproj"
  # CHANGE ME nếu đường dẫn API khác

  UNIT_TEST_PROJECT: "./src/SRD_Master/SafeRide.UnitTests/SafeRide.UnitTests.csproj"
  # CHANGE ME nếu đường dẫn project test khác

  PUBLISH_DIRECTORY: "./publish"

  DEPLOY_BRANCH: "monsterasp-deploy"
  # CHANGE ME nếu muốn tên branch deploy khác

  RUNTIME_IDENTIFIER: "win-x86"
  # CHANGE ME nếu hosting yêu cầu runtime khác

jobs:
  test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show .NET version
        run: dotnet --version

      - name: Restore tests
        run: dotnet restore "${{ env.UNIT_TEST_PROJECT }}"

      - name: Run tests
        run: >
          dotnet test "${{ env.UNIT_TEST_PROJECT }}"
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ github.workspace }}\TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SafeRide-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish to Deploy Branch
    runs-on: windows-latest

    # Nếu muốn chỉ deploy khi test PASS thì bỏ comment 2 dòng dưới:
    # needs: test
    # if: success()

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show .NET version
        run: dotnet --version

      - name: Restore API for runtime
        run: >
          dotnet restore "${{ env.API_PROJECT }}"
          --runtime "${{ env.RUNTIME_IDENTIFIER }}"

      - name: Publish API
        run: >
          dotnet publish "${{ env.API_PROJECT }}"
          --configuration Release
          --framework net8.0
          --runtime "${{ env.RUNTIME_IDENTIFIER }}"
          --self-contained true
          --no-restore
          --output "${{ env.PUBLISH_DIRECTORY }}"

      - name: Verify publish output
        shell: powershell
        run: |
          $requiredFiles = @(
            "${{ env.PUBLISH_DIRECTORY }}\SafeRide.API.dll",
            "${{ env.PUBLISH_DIRECTORY }}\SafeRide.API.exe",
            "${{ env.PUBLISH_DIRECTORY }}\SafeRide.API.deps.json",
            "${{ env.PUBLISH_DIRECTORY }}\SafeRide.API.runtimeconfig.json",
            "${{ env.PUBLISH_DIRECTORY }}\web.config"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Missing required publish file: $file"
            }
          }

          Write-Host "Publish output is valid."

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: SafeRide-API-publish
          path: ${{ env.PUBLISH_DIRECTORY }}
          if-no-files-found: error
          retention-days: 7

      # Quan trọng:
      # Checkout branch deploy hiện tại để GIỮ lịch sử Git.
      - name: Checkout deploy branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          path: deploy-repo
          fetch-depth: 0

      - name: Update deploy branch
        shell: powershell
        run: |
          $publishDir = (Resolve-Path "${{ env.PUBLISH_DIRECTORY }}").Path
          $deployDir = "${{ github.workspace }}\deploy-repo"

          Write-Host "Publish directory: $publishDir"
          Write-Host "Deploy directory: $deployDir"

          # Xóa publish cũ nhưng GIỮ .git
          Get-ChildItem -Path $deployDir -Force |
            Where-Object { $_.Name -ne ".git" } |
            Remove-Item -Recurse -Force

          # Copy publish mới vào deploy branch
          Get-ChildItem -Path $publishDir -Force |
            Copy-Item -Destination $deployDir -Recurse -Force

          Set-Location $deployDir

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all

          # Không tạo commit rỗng nếu publish không thay đổi
          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No deploy changes detected."
            exit 0
          }

          git commit -m "Deploy ${{ github.sha }}"

          # KHÔNG dùng --force
          git push origin "${{ env.DEPLOY_BRANCH }}"